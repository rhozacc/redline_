<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redline — Local LLM Memory Budget</title>
    <meta name="description" content="Visualize unified memory pressure for Apple Silicon local inference. Watch KV cache eat your headroom as context grows." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background:
          radial-gradient(130% 90% at 50% -20%, #11161D, #07080B 70%);
        background-attachment: fixed;
      }
      #root { min-height: 100vh; }
      /* light global vignette — keeps the particle glow alive in the margins */
      .bg-scrim { position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: radial-gradient(120% 95% at 50% 35%, rgba(7,8,11,0.05), rgba(7,8,11,0.50) 92%); }

      ::selection { background: rgba(210,59,59,0.30); }

      /* frosted blur behind main content (not the title) — fades in at the top edge */
      .content-frost {
        position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background: rgba(8,10,14,0.5);
        -webkit-backdrop-filter: blur(14px) saturate(115%);
                backdrop-filter: blur(14px) saturate(115%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 56px);
                mask-image: linear-gradient(to bottom, transparent 0, #000 56px);
      }

      /* range input cross-browser */
      input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; outline: none; }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
        cursor: pointer; background: #E6E9ED;
        border: 2px solid #0B0D10;
        box-shadow: 0 0 0 1px rgba(230,233,237,0.4), 0 1px 4px rgba(0,0,0,0.5);
        transition: box-shadow 0.15s, transform 0.1s;
      }
      input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); }
      input[type=range]::-moz-range-thumb {
        width: 15px; height: 15px; border-radius: 50%; cursor: pointer;
        background: #E6E9ED; border: 2px solid #0B0D10;
      }
      input[type=number] { -moz-appearance: textfield; }
      input[type=number]::-webkit-outer-spin-button,
      input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

      /* staggered section reveal on load */
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .reveal { opacity: 0; animation: riseIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }

      /* explainer modal entrance */
      @keyframes explainFade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes explainPop {
        from { opacity: 0; transform: translateY(12px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      .explain-backdrop { animation: explainFade 0.16s ease-out both; }
      .explain-card { animation: explainPop 0.26s cubic-bezier(0.22,1,0.36,1) both; }

      /* footprint expand-to-full-width: grows in, pushing the columns down */
      @keyframes bandGrow {
        from { max-height: 0; opacity: 0; transform: translateY(-8px); }
        to   { max-height: 860px; opacity: 1; transform: translateY(0); }
      }
      .expand-band { overflow: hidden; animation: bandGrow 0.46s cubic-bezier(0.22,1,0.36,1) both; }

      /* snap pulse */
      @keyframes snapPulse {
        0%   { box-shadow: 0 0 0 0 rgba(201,148,46,0.6); }
        70%  { box-shadow: 0 0 0 8px rgba(201,148,46,0); }
        100% { box-shadow: 0 0 0 0 rgba(201,148,46,0); }
      }
      .snap-pulse { animation: snapPulse 0.4s ease-out; }

      /* fade-in for search results */
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade-slide-in { animation: fadeSlideIn 0.18s ease-out forwards; }

      /* gauge fill */
      @keyframes gaugeGrow {
        from { width: 0%; }
      }

      /* spinner */
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 0.8s linear infinite; }

      /* status dot pulse */
      @keyframes dotGlow {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }

      /* verdict callout on the 3D marker — blends in (40% opaque), pops on hover */
      .marker-callout { opacity: 0.4; transition: opacity 0.22s ease; }
      .marker-callout:hover { opacity: 1; }

      /* prefill bar alarm — flashes + swells when peak clears the redline */
      @keyframes prefillAlert {
        0%, 100% { transform: scaleY(1);   box-shadow: 0 0 0 0 rgba(210,59,59,0);    filter: brightness(1); }
        50%      { transform: scaleY(1.7); box-shadow: 0 0 16px 2px rgba(210,59,59,0.6); filter: brightness(1.4); }
      }
      .prefill-alert { animation: prefillAlert 0.8s ease-in-out infinite; will-change: transform, box-shadow, filter; }

      /* subtle hover lift for chip/preset/select controls */
      .hover-lift { transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.15s, background 0.15s, color 0.15s; }
      .hover-lift:hover { transform: translateY(-1px); box-shadow: 0 3px 12px rgba(0,0,0,0.35); }
      .hover-lift:active { transform: translateY(0); box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
